<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SellBot Admin Panel</title>
<style>
body{font-family:Arial;background:#0f172a;color:#fff;padding:20px}
table{width:100%;border-collapse:collapse}
th,td{border:1px solid #334155;padding:8px}
th{background:#1e293b}
</style>
</head>
<body>

<h1>📊 SellBot Dashboard</h1>
<p><b>Total Orders:</b> {{ orders }}</p>
<p><b>Total Sales:</b> ₱{{ total }}</p>

<h2>📦 Products</h2>
<table>
<tr>
  <th>File</th>
  <th>Price</th>
  <th>Stock</th>
</tr>
{% for p in products %}
<tr>
  <td>{{ p[0] }}</td>
  <td>₱{{ p[1] }}</td>
  <td>{{ p[2] }}</td>
</tr>
{% endfor %}
</table>

</body>
</html>
