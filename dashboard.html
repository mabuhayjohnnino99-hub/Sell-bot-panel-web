<!DOCTYPE html>
<html>
<head>
<title>SellBot Admin</title>
<style>
body{background:#0f172a;color:white;font-family:Arial;padding:20px}
table{border-collapse:collapse;width:100%}
th,td{border:1px solid #334155;padding:8px}
th{background:#1e293b}
</style>
</head>
<body>

<h1>📊 SellBot Dashboard</h1>
<p>Total Orders: {{ orders }}</p>
<p>Total Sales: ₱{{ total }}</p>

<h2>Products</h2>
<table>
<tr><th>File</th><th>Price</th><th>Stock</th></tr>
{% for p in products %}
<tr>
<td>{{ p[0] }}</td>
<td>₱{{ p[1] }}</td>
<td>{{ p[2] }}</td>
</tr>
{% endfor %}
</table>

</body>
</html>
